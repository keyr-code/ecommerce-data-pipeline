services:
  mongodb:
    image: mongo:7.0
    container_name: pipeline_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: pipeline_logs
    volumes:
      - mongodb_data:/data/db
      - ./config:/app/config
    networks:
      - pipeline_network

  pipeline:
    build: .
    container_name: data_pipeline
    depends_on:
      - mongodb
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USERNAME=admin
      - MONGO_PASSWORD=password123
      - MONGO_DATABASE=pipeline_logs
      - DUCKDB_PATH=/app/database/data_eng.db
      - DATA_PATH=/app/data
      - PYTHONPATH=/app
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
      - ./database:/app/database
      - ./sql:/app/sql
      - ./config:/app/config
    networks:
      - pipeline_network
    command: tail -f /dev/null  # Keep container running for interactive use

  mongo-express:
    image: mongo-express:1.0.0
    container_name: pipeline_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongodb
    networks:
      - pipeline_network

volumes:
  mongodb_data:

networks:
  pipeline_network:
    driver: bridge